const HY = [470,592,714,836,958];
$('app').innerHTML = `<div class="greet-d abs">${S.greetD}</div><div class="greet abs">${S.greet}</div><div class="settings abs">⚙ ${S.settings}</div>
 <div class="hero abs"><svg class="ring abs" viewBox="0 0 130 130"><circle cx="65" cy="65" r="56" stroke="#262a33" stroke-width="12" fill="none"/>
  <circle id="ringc" cx="65" cy="65" r="56" stroke="url(#rg)" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(-90 65 65)" stroke-dasharray="351.9" stroke-dashoffset="211"/>
  <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#4f8bff"/></linearGradient></defs></svg>
  <div class="ringtxt abs"><b id="ringn">2/5</b><i>${S.habitsLbl}</i></div>
  <div class="htitle abs" id="htitle">${S.hero[0]}</div><div class="hsub abs" id="hsub">${S.left(3)}</div>
  <div class="streak abs" id="streak">${SVG.flame('#ff9f43',20)}<span id="streakn">${S.streak(26)}</span> · ${S.lv} 7</div></div>
 <div class="rlabel abs">${S.routine}</div>
 ${S.habits.map(([n,m],i)=>`<div class="habit abs" id="h${i}" style="top:${HY[i]}px"><div class="box abs"></div><div class="chk abs" id="hc${i}">${SVG.check()}</div>
   <div class="nm abs" id="hn${i}">${n}</div><div class="meta abs">${m}</div><div class="strike abs" id="hs${i}" style="width:${n.length*14.5}px"></div></div>`).join('')}
 <div class="tap abs" id="tap2"></div>
 <div class="foot abs" id="foot"></div>
 <div class="abs" id="abud" style="left:430px;top:1100px"></div>`;
$('cele').innerHTML = `<div class="dim abs" id="dim"></div><div id="confw" class="abs" style="inset:0"></div>
 <div class="sheet abs" id="sheet"><div class="flame">${SVG.flame('#ff9f43',70)}</div><h2>${S.pb}</h2>
 <div class="big"><div id="n26">26</div><div id="n27">27</div></div><div class="sm">${S.days}</div><div class="btn">${S.keep}</div></div>`;
const CONF = []; { const r=rng(7), cols=['#7c5cff','#2fd180','#ff9f43','#ff8fc0','#4f8bff','#ffd166'];
  for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='conf abs'; d.style.background=cols[i%6]; $('confw').appendChild(d);
    CONF.push({el:d, a:-Math.PI/2+(r()-.5)*2.4, v:900+r()*900, spin:(r()-.5)*1400, x0:307+(r()-.5)*60, y0:620, sz:.6+r()*.8}); } }
$('caps').innerHTML = S.caps.map((c,i)=>`<div class="cap abs" id="c${i}"><h1>${c.filter(Boolean).map((line,j,arr)=>
  `<span class="${j==arr.length-1?'g':''}">${line.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}</span>`).join('<br>')}</h1></div>`).join('');
$('end').innerHTML = `<div id="ebud"></div><h1 id="eh">Mingui</h1><p id="ep">${S.endA}<br><b>${S.endB}</b></p><div class="badge" id="eb">${S.badge}</div><div class="free" id="ef">${S.free}</div>`;
// 12-week heatmap, 7 rows; pattern mostly done with a few misses, like a real 27-day streak
const HM=[]; { const r=rng(3); for(let i=0;i<84;i++){ const d=document.createElement('div'); const age=83-i-(i%7);
  const done = (i>=84-27)||r()>.25; d.dataset.col = done?(r()>.3?'#2fd180':'#279a64'):'#2a2f3a'; $('hm').appendChild(d); HM.push(d);} }
$('hm').style.gridAutoFlow='column'; $('hm').style.gridTemplateRows='repeat(7,58px)'; $('hm').style.gridTemplateColumns='repeat(12,58px)';

// ---------- timeline ----------
const T = { home:[0,3.1], lock:[3.1,6.3], app:[6.3,11.2], cele:[11.2,14.6], unl:[14.6,17.8], bud:[17.8,21.2], end:[21.2,25] };
const DURATION = 25;
const CAPW = [[0.15,3.0],[3.3,6.2],[6.5,11.0],[11.3,14.5],[14.7,17.7],[17.9,21.1]];
const TICKS = [7.3,8.5,9.7]; // habits 2,3,4 get ticked
const COLORS = [['#9a80ff','#5b3fd9'],['#7de3b5','#1fa865'],['#ffc07a','#f2683c'],['#7ab8ff','#2f5fd9'],['#ffa8d8','#d9408f']];
const HATN = ['party','crown','beanie','cap'];

function caption(i,t){
  const [a,b]=CAPW[i], el=$('c'+i), on = t>=a-.01 && t<=b+.01;
  el.style.visibility = on?'visible':'hidden'; if(!on) return;
  const ws = el.querySelectorAll('.w'); const out = eIn(lin(t,b-.35,b));
  ws.forEach((w,k)=>{ const p = eOut(lin(t,a+k*.07,a+k*.07+.55)); w.style.opacity = p*(1-out);
    w.style.transform = `translateY(${(1-p)*60 - out*30}px) rotate(${(1-p)*4}deg)`; w.style.filter=`blur(${(1-p)*8+out*6}px)`; });
}
function render(t){
  // background colour drifts per scene
  const bgc = t<T.lock[0]?'#2a2f6e':t<T.app[0]?'#5a1f3a':t<T.cele[0]?'#3b2a8c':t<T.unl[0]?'#6a3a10':t<T.bud[0]?'#1c5a48':'#3b2a8c';
  $('bg').style.setProperty('--bc',bgc); $('bg').style.setProperty('--bx',(50+30*Math.sin(t*.35))+'%'); $('bg').style.setProperty('--by',(22+6*Math.cos(t*.5))+'%');
  for(let i=0;i<CAPW.length;i++) caption(i,t);

  // ---- phone camera: enters from below, floats, pushes in on the checklist, exits for the buddy scene
  const enter = eOut(lin(t,0,.9)), exit = eIO(lin(t,T.bud[0]-.1,T.bud[0]+.7));
  const push = eIO(lin(t,T.app[0]+.2,T.app[0]+1.1)) - eIO(lin(t,T.cele[0]-.3,T.cele[0]+.4));
  const shake = t>T.lock[0]+.15 && t<T.lock[0]+.55 ? Math.sin((t-T.lock[0])*70)*10*(1-lin(t,T.lock[0]+.15,T.lock[0]+.55)) : 0;
  const tapPunch = TICKS.reduce((s,k)=>s+Math.max(0,1-Math.abs(t-k-.05)/.12),0)*.008;
  st('phone',{o:Math.min(enter,1-exit), y:(1-enter)*500 + exit*700 + Math.sin(t*1.3)*8 + push*60, x:shake + exit*0,
     ry: Math.sin(t*.7)*5*(1-push) , rx: 4*(1-enter) + Math.cos(t*.9)*2, s:(.96 + push*.1 - tapPunch)*(1-exit*.3)});
  $('clk').textContent = t<T.unl[0]? '7:12' : '7:48';

  // ---- scene 1: home screen
  const homeOn = t<T.lock[0]+.4 || (t>=T.unl[0]-.3 && t<T.bud[0]+1);
  $('home').style.visibility = homeOn?'visible':'hidden';
  $('hclock').textContent = t<T.unl[0]? '7:12':'7:48';
  S.apps.forEach((_,i)=>{ const k = eBack(lin(t,.35+i*.05,.85+i*.05)); const back = t>=T.unl[0];
     const k2 = back? eBack(lin(t,T.unl[0]-.2+i*.04,T.unl[0]+.3+i*.04)) : k;
     const yt = i===4 ? (t>2.25&&t<2.6? 1-.12*Math.sin(lin(t,2.25,2.6)*Math.PI) : 1) : 1;
     const joy = back && BLOCKED.includes(i) ? 1+.18*Math.sin(lin(t,T.unl[0]+.9+BLOCKED.indexOf(i)*.35,T.unl[0]+1.4+BLOCKED.indexOf(i)*.35)*Math.PI) : 1;
     st('a'+i,{o:k2, s:(.6+.4*k2)*yt*joy}); });
  BLOCKED.forEach((i,j)=>{ const p = lin(t,T.unl[0]+.8+j*.35,T.unl[0]+1.25+j*.35);   // locks pop off one by one
     const pin = eBack(lin(t,1.0+j*.1,1.4+j*.1));
     st('lb'+i,{o: t<T.unl[0]? pin : 1-eIn(p), s: t<T.unl[0]? pin : 1+p*.6, y: -eOut(p)*90, r: p*40, x:p*30}); });
  const tp = lin(t,2.15,2.7); st('tap',{o: tp>0&&tp<1 ? (1-tp)*.9 : 0, s:.4+tp*.9}); $('tap').style.left='397px'; $('tap').style.top='520px';
  const ytZoom = eIn(lin(t,2.65,T.lock[0]+.2)); st('home',{s:1+ytZoom*1.4*(t<T.unl[0]-.3?1:0), o:t<T.unl[0]?1-eIn(lin(t,2.9,T.lock[0]+.3)):eOut(lin(t,T.unl[0]-.3,T.unl[0]+.2)), pre:''});
  $('home').style.transformOrigin='397px 520px';

  // ---- scene 2: lock screen
  const lk = win(t,T.lock[0]-.15,T.app[0]+.2,.3,.4); $('lock').style.visibility = lk>0?'visible':'hidden'; $('lock').style.opacity=lk;
  st('lockbig',{s:eElastic(lin(t,T.lock[0],T.lock[0]+1)), r: Math.sin(lin(t,T.lock[0]+.15,T.lock[0]+.8)*Math.PI*4)*10*(1-lin(t,T.lock[0]+.15,T.lock[0]+.8))});
  [['lockt',.25],['locks',.4],['pill',.55]].forEach(([id,d])=>{ const p=eOut(lin(t,T.lock[0]+d,T.lock[0]+d+.5)); st(id,{o:p,y:(1-p)*30,pre:id==='pill'?'translateX(-50%) ':''}); });
  const bp = eBack(lin(t,T.lock[0]+.9,T.lock[0]+1.5)); const hop = Math.abs(Math.sin((t-T.lock[0])*5))*18*lin(t,T.lock[0]+1.5,T.lock[0]+1.7);
  $('lbud').innerHTML = buddySVG({w:200, blink: blinkAt(t), smile:-.4+ .4*0, look:-.6});
  st('lbud',{y:(1-bp)*400 - hop});
  const bb = eBack(lin(t,T.lock[0]+1.4,T.lock[0]+1.8)); st('bubble',{o:bb>0?1:0, s:bb, y:-hop});

  // ---- scene 3: the Mingui checklist
  const ap = win(t,T.app[0]-.3,T.cele[0]+3.4,.5,.3) * (t<T.unl[0]-.2?1:0);
  $('app').style.visibility = ap>0?'visible':'hidden'; st('app',{o:ap, s:mix(1.08,1,eOut(lin(t,T.app[0]-.3,T.app[0]+.4)))});
  let done = 2; TICKS.forEach(k=>{ if(t>=k) done++; });
  S.habits.forEach((_,i)=>{ const k = i<2 ? 99 : TICKS[i-2]; const p = i<2?1:eBack(lin(t,k,k+.35)), sp=i<2?1:eOut(lin(t,k+.1,k+.45));
    const el=$('h'+i); el.style.background = (i<2||t>=k+.05)?'var(--done)':'var(--card)'; el.style.borderColor=(i<2||t>=k+.05)?'#1e3b2c':'var(--border)';
    const press = i>=2 ? 1-.035*Math.sin(clamp((t-k+.12)/.24)*Math.PI) : 1;
    st(el,{s:press}); st('hc'+i,{s:p, o:p>0?1:0}); st('hs'+i,{sx:sp, sy:1, o:sp>0?1:0});
    $('hn'+i).style.color = sp>.5?'#7f8a99':'#f2f4f8';
    // entrance stagger
    const en = eOut(lin(t,T.app[0]+.1+i*.06,T.app[0]+.6+i*.06)); el.style.opacity=en; el.style.translate = `0 ${(1-en)*40}px`; });
  // tap ripple follows the habit being ticked
  const cur = TICKS.findIndex(k=>t>k-.25&&t<k+.35); const tp2 = cur>=0? lin(t,TICKS[cur]-.2,TICKS[cur]+.35):0;
  st('tap2',{o: cur>=0? (1-tp2)*.8:0, s:.3+tp2*.9}); if(cur>=0){ $('tap2').style.left='74px'; $('tap2').style.top=(HY[cur+2]+52)+'px'; }
  // ring + counters (ring animates smoothly between steps)
  let ringv = 2; TICKS.forEach(k=> ringv += eOut(lin(t,k+.05,k+.55)));
  $('ringc').setAttribute('stroke-dashoffset', 351.9*(1-ringv/5)); $('ringn').textContent = `${done}/5`;
  if(done===5){ $('ringc').setAttribute('stroke','#2fd180'); } else $('ringc').setAttribute('stroke','url(#rg)');
  $('htitle').textContent = done<4?S.hero[0]:done<5?S.hero[1]:S.hero[2]; $('hsub').textContent = done<5?S.left(5-done):S.doneSub;
  const sbump = eBack(lin(t,TICKS[2]+.3,TICKS[2]+.7));
  $('streakn').textContent = S.streak(t>=TICKS[2]+.3?27:26); st('streak',{s: t>=TICKS[2]+.3 && t<TICKS[2]+.7 ? 1+.25*Math.sin(lin(t,TICKS[2]+.3,TICKS[2]+.7)*Math.PI):1});
  const ft=$('foot'); if(done<5){ ft.style.background='#1b1e26'; ft.style.color='#b9c0cc'; ft.innerHTML=SVG.lock('#b9c0cc',22)+S.more(5-done); }
  else { ft.style.background='linear-gradient(90deg,#7c5cff,#4f8bff)'; ft.style.color='#fff'; ft.innerHTML=S.unlocked+' '+SVG.check('#fff',24); }
  const fp = done===5 ? eBack(lin(t,TICKS[2]+.15,TICKS[2]+.6)) : 1; st(ft,{s:fp});
  // buddy cheers from the bottom corner on each tick
  const cheer = TICKS.reduce((s,k)=>s+Math.max(0,Math.sin(clamp((t-k)/.5)*Math.PI)),0);
  $('abud').innerHTML = buddySVG({w:150, blink:blinkAt(t+.7), smile:1+cheer*.6, look:-.5});
  const ain = eBack(lin(t,T.app[0]+.8,T.app[0]+1.3)); st('abud',{y:(1-ain)*300 - cheer*50, r:Math.sin(t*6)*cheer*8});

  // ---- scene 4: celebration
  const cl = win(t,T.cele[0],T.cele[1]+.2,.25,.35); $('cele').style.visibility = cl>0?'visible':'hidden';
  $('dim').style.opacity = cl; const sp = eBack(lin(t,T.cele[0]+.1,T.cele[0]+.6));
  st('sheet',{o:cl, s:.6+.4*sp, y:(1-sp)*80});
  const roll = eIO(lin(t,T.cele[0]+.8,T.cele[0]+1.4)); st('n26',{y:-roll*120,o:1-roll}); st('n27',{y:(1-roll)*120,o:roll, s:1+.2*Math.sin(lin(t,T.cele[0]+1.3,T.cele[0]+1.7)*Math.PI)});
  const ct = t-(T.cele[0]+.15);
  CONF.forEach(c=>{ if(ct<0||cl<=0){ c.el.style.opacity=0; return; }
     const x = c.x0 + Math.cos(c.a)*c.v*ct*.7 + Math.sin(ct*3+c.spin)*20, y = c.y0 + Math.sin(c.a)*c.v*ct + 900*ct*ct;
     c.el.style.opacity = clamp(1.6-ct*.5)*cl; c.el.style.transform=`translate(${x}px,${y}px) rotate(${c.spin*ct}deg) scale(${c.sz},${c.sz*Math.cos(ct*8+c.spin)})`; });

  // ---- scene 6: buddy showcase (outside the phone)
  const bo = win(t,T.bud[0]+.2,T.end[0]+.15,.6,.45);
  const bb2=$('bigbuddy'); bb2.style.visibility = bo>0?'visible':'hidden';
  if(bo>0){ const lt=t-T.bud[0]; const ci=Math.floor(clamp((lt-.6)/.55,0,COLORS.length-1)); const hi=Math.floor(clamp((lt-.9)/.55,0,3.99));
    const squash = Math.sin(lt*7)*.05;
    bb2.innerHTML = buddySVG({w:560, c1:COLORS[ci][0], c2:COLORS[ci][1], hat:lt>.9?HATN[hi]:'none', blink:blinkAt(t), smile:1.4, wings:eOut(lin(lt,2.6,3))});
    bb2.style.left='260px'; bb2.style.top='560px';
    const pop = Math.max(0,1-((lt-.6)%.55)/.2)*(lt>.6&&lt<.6+.55*(COLORS.length-1)+.2?1:0);
    st(bb2,{o:bo, s:(.7+.3*eBack(lin(lt,.2,.8)))*(1+pop*.08), sx:undefined, y:Math.sin(lt*3)*14, r:Math.sin(lt*2)*3}); }
  const hm = win(t,T.bud[0]+.5,T.end[0]+.15,.4,.4); $('hm').style.visibility = hm>0?'visible':'hidden'; $('hm').style.opacity=hm;
  HM.forEach((d,i)=>{ const col=Math.floor(i/7), row=i%7; const p = eBack(lin(t,T.bud[0]+.7+(col+row)*.07,T.bud[0]+1.0+(col+row)*.07));
     d.style.background = p>.5? d.dataset.col : '#2a2f3a'; d.style.transform=`scale(${.3+.7*clamp(p,0,1.3)})`; d.style.opacity=clamp(p*2); });

  // ---- scene 7: end card
  const ep = t-T.end[0]; const eo = clamp(ep*3); $('end').style.visibility = eo>0?'visible':'hidden'; $('end').style.opacity=eo;
  if(eo>0){ $('ebud').innerHTML = buddySVG({w:300, blink:blinkAt(t), smile:1.2, hat:'party'});
    st('ebud',{s:eBack(lin(ep,0,.5)), y:Math.sin(ep*3)*10});
    [['eh',.15],['ep',.35],['eb',.6],['ef',.8]].forEach(([id,d])=>{ const p=eOut(lin(ep,d,d+.6)); st(id,{o:p,y:(1-p)*50,f:`blur(${(1-p)*8}px)`}); }); }
}
function blinkAt(t){ const c=t%3.1; return c<.14? Math.sin(c/.14*Math.PI):0; }
window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.ready.then(()=>true);
const t0 = Q.get('t'); if(t0!==null) render(+t0);
if(Q.get('play')){ const s=performance.now(); (function f(){ render(((performance.now()-s)/1000)%DURATION); requestAnimationFrame(f); })(); }
if(t0===null && !Q.get('play')) render(0);
</script></body></html>
